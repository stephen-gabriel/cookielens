<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4943a"/>
      <stop offset="100%" stop-color="#a06820"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00cc88"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ddaa"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="lensClip">
      <circle cx="54" cy="50" r="34"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Lens glass tint (inside the circle) -->
  <circle cx="54" cy="50" r="34" fill="#0a1a14" opacity="0.6"/>

  <!-- Cookie inside the lens — clipped to lens circle -->
  <g clip-path="url(#lensClip)">
    <!-- Cookie body -->
    <circle cx="54" cy="52" r="26" fill="url(#cookie)"/>
    <circle cx="54" cy="52" r="26" fill="none" stroke="#c4843a" stroke-width="1" opacity="0.5"/>

    <!-- Chocolate chips -->
    <circle cx="43" cy="42" r="4.5" fill="#4a2810" opacity="0.85"/>
    <circle cx="62" cy="40" r="3.5" fill="#4a2810" opacity="0.85"/>
    <circle cx="66" cy="58" r="4.5" fill="#4a2810" opacity="0.85"/>
    <circle cx="44" cy="64" r="4" fill="#4a2810" opacity="0.85"/>
    <circle cx="55" cy="53" r="3" fill="#4a2810" opacity="0.7"/>

    <!-- Cookie crumble texture -->
    <circle cx="50" cy="48" r="1.5" fill="#c8884a" opacity="0.35"/>
    <circle cx="60" cy="60" r="2" fill="#c8884a" opacity="0.3"/>
    <circle cx="38" cy="55" r="1.5" fill="#c8884a" opacity="0.3"/>
  </g>

  <!-- Magnifying glass ring with glow -->
  <circle cx="54" cy="50" r="34" fill="none" stroke="url(#lens)" stroke-width="5" filter="url(#glow)"/>

  <!-- Lens reflection highlight -->
  <ellipse cx="40" cy="36" rx="10" ry="5" fill="#fff" opacity="0.12" transform="rotate(-30 40 36)"/>

  <!-- Magnifying glass handle -->
  <line x1="79" y1="76" x2="108" y2="105" stroke="url(#handle)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Handle inner highlight -->
  <line x1="80" y1="77" x2="106" y2="103" stroke="#00ffcc" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>